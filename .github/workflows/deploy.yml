name: Deploy Web to VPS

on:
  push:
    branches: [ "codex2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Все команды по умолчанию выполняем в каталоге web/
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # lock-файл лежит в web/
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Write .env.production for build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          EOF

      - name: Build
        run: npm run build

      - name: Pack artifact
        run: |
          tar -czf web_artifact.tgz \
            .next \
            public \
            package.json package-lock.json \
            prisma \
            next.config.* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_artifact
          path: web/web_artifact.tgz
          if-no-files-found: error

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/web/ghostdesk_web/web
      PRISMA_SCHEMA: prisma/schema.prisma
      PM2_APP: ghostdesk-web
      PRISMA_VER: 6.17.1
      NODE_ENV: production
      PRISMA_HIDE_UPDATE_MESSAGE: 1

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web_artifact

      - name: Copy artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web_artifact.tgz"
          target: "/home/web/ghostdesk_web/"

      - name: Deploy via SSH (wipe + fresh push)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_DIR,PRISMA_SCHEMA,PM2_APP,PRISMA_VER,NODE_ENV,PRISMA_HIDE_UPDATE_MESSAGE
          script: |
            set -euo pipefail

            echo "==> Prepare dir"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Stop app if running"
            pm2 stop "$PM2_APP" || true

            echo "==> Clean release dir (keep .env if есть)"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +

            echo "==> Unpack new release"
            tar -xzf ../web_artifact.tgz -C "$APP_DIR"

            echo "==> Ensure .env"
            DB_URL='${{ secrets.PROD_DATABASE_URL }}'
            if [ -z "${DB_URL}" ]; then
              DB_URL='file:./prisma/dev.db'
            fi
            printf 'DATABASE_URL="%s"\n' "$DB_URL" > .env

            echo "==> Install runtime deps"
            npm ci --omit=dev --prefer-offline --no-audit

            echo "==> Prisma client generate"
            npx --yes prisma@${PRISMA_VER} generate --schema="$PRISMA_SCHEMA"

            echo "==> DROP & RECREATE schema (db push force-reset)"
            npx --yes prisma@${PRISMA_VER} db push --schema="$PRISMA_SCHEMA" --force-reset

            # Если нужен сид — раскомментируй:
            # echo "==> Seed"
            # node prisma/seed.mjs || true

            echo "==> Start / Reload app via PM2"
            pm2 start npm --name "$PM2_APP" -- start -- --hostname 0.0.0.0 --port 3000 \
              || pm2 reload "$PM2_APP" --update-env

            pm2 save || true
            echo "✅ Fresh deploy done at $(date -Is)"
